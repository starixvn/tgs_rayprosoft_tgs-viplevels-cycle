include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/viplevels-cycle
  TgsSettingKey: viplevels-cycle
  HelmTemplateFolderName: viplevels-cycle
  BuildCacheKey: Tgs.VipLevels.Cycle.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template
  script:
    - dotnet test "**/bin/$BuildConfiguration/$Framework/*Test.dll" -l:'junit;LogFilePath=TestResults/TestResults.xml'

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.VipLevels.Cycle" $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateFolderName $ImageName $Tag

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: service-dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - |
      cat << EOF | deploy_k8s default $HelmTemplateFolderName $namespace
        {
           "replicaCount": 1
        }
      EOF

deploy-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: service-staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - |
      cat << EOF | deploy_k8s default $HelmTemplateFolderName $namespace
        {
           "replicaCount": 1
        }
      EOF

deploy-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: service-prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | deploy_k8s default $HelmTemplateFolderName $namespace
        {
           "replicaCount": 1
        }
      EOF