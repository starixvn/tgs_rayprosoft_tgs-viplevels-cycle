apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "viplevels-cycle.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "viplevels-cycle.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information"
        }
      },
      "VipLevelConnectionStrings": {
        "VipLevelServiceClientBaseUrl": "http://tgs-viplevel",
        "PlayerServiceClientBaseUrl": "http://player-api"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]